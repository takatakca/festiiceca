name: FESTI-ICE database guard tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkout-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: festiice_ci
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festiice_ci"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: festiice_ci
      PGPASSWORD: test_only_password
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y postgresql-client
          fi
      - name: Bootstrap isolated schema
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/checkout-guard-fixtures.sql
      - name: Apply checkout hardening migration
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016150000_checkout_session_guards.sql
      - name: Run transactional checkout assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/checkout-guard-assertions.sql

      - name: Bootstrap refund integration fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/refund-fixtures.sql
      - name: Apply guarded full-refund migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016160000_stripe_full_refund_reconciliation.sql
      - name: Verify full-refund idempotency and QR revocation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/refund-assertions.sql

      - name: Create restricted operations audit test fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/operations-fixtures.sql
      - name: Apply operational slot controls
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016170000_operational_slot_controls.sql
      - name: Verify role, audit and reopening restrictions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/operations-assertions.sql
      - name: Prepare scanner and refund fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/gate-fixtures.sql
      - name: Apply secure ticket redemption replacement
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016183000_secure_ticket_redemption.sql
      - name: Assert role, paid order, single scan and time-of-entry
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/gate-assertions.sql
      - name: Create isolated checkout transaction database
        run: psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE festiice_checkout_ci;"
      - name: Bootstrap original ticketing schema dependencies
        run: PGDATABASE=festiice_checkout_ci psql -v ON_ERROR_STOP=1 -f tests/sql/checkout-integration-fixtures.sql
      - name: Apply actual foundational checkout RPC migration
        run: PGDATABASE=festiice_checkout_ci psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014190000_checkout_transactional_foundation.sql
      - name: Apply checkout session guards on original checkout RPC
        run: PGDATABASE=festiice_checkout_ci psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016150000_checkout_session_guards.sql
      - name: Apply orphaned Stripe session compensation guard
        run: PGDATABASE=festiice_checkout_ci psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016200000_checkout_session_compensation.sql
      - name: Assert paid order, replay, pricing, cancellation and capacity invariants
        run: PGDATABASE=festiice_checkout_ci psql -v ON_ERROR_STOP=1 -f tests/sql/checkout-integration-assertions.sql
      - name: Apply durable financial exception ledger
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016193000_financial_event_review_ledger.sql
      - name: Validate duplicate Stripe events and private manual reviews
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/financial-review-assertions.sql

      - name: Apply human financial review resolution
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016210000_financial_review_resolution.sql
      - name: Verify administrative resolution and least privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/financial-review-resolution-assertions.sql
