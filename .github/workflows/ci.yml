name: FESTI-ICE CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      # The legacy npm lockfile is out of sync with package.json. Update it
      # in the runner until the repository lockfile is regenerated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Existing repository has >1,400 legacy Prettier discrepancies.
      # Keep semantic ESLint rules enforced; normalize formatting separately.
      - name: Lint (semantic rules)
        run: "npx eslint . --rule 'prettier/prettier: off'"
      - name: Build server
        run: npm run build
