name: FESTI-ICE CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      # The legacy npm lockfile is out of sync with package.json. Update it
      # in the runner until the repository lockfile is regenerated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Existing repository has >1,400 legacy Prettier discrepancies.
      # Keep semantic ESLint rules enforced; normalize formatting separately.
      - name: Lint (semantic rules)
        run: "npx eslint . --rule 'prettier/prettier: off'"
      - name: Payment readiness regression tests
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Build server
        run: npm run build:node

      - name: Smoke test SSR and closed checkout
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080 HOST=127.0.0.1 node .output/server/index.mjs >/tmp/festiice-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ -o /tmp/festiice-index.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/festiice-server.log
            exit 1
          fi
          grep -q 'FESTI-ICE' /tmp/festiice-index.html
          curl --fail --silent http://127.0.0.1:8080/billets -o /tmp/festiice-billets.html
          grep -q 'billets' /tmp/festiice-billets.html
          curl --fail --silent http://127.0.0.1:8080/personnel -o /tmp/festiice-personnel.html
          grep -q 'personnel' /tmp/festiice-personnel.html
          curl --fail --silent http://127.0.0.1:8080/api/health -o /tmp/festiice-health.json
          node -e "const h=require('/tmp/festiice-health.json'); if (h.ok!==true || h.service!=='festiice') process.exit(1)"
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' --data '{}' http://127.0.0.1:8080/api/checkout)
          [ "$status" = "503" ]
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' --data '{}' http://127.0.0.1:8080/api/stripe/webhook)
          [ "$status" = "503" ]

      - name: Verify Vercel SSR build output
        shell: bash
        run: |
          set -euo pipefail
          npm run build:vercel
          test -f .vercel/output/config.json
          grep -q '"version"' .vercel/output/config.json
